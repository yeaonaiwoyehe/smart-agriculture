# 生产环境：连接与凭据通过环境变量注入；默认值为容器网络内的服务名
spring:
  application:
    name: jt808
  datasource:
    url: jdbc:postgresql_postGIS://${PG_HOST:postgres}:${PG_PORT:5432}/${PG_DB:AgriNav}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgis.DriverWrapper
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
      time: HH:mm:ss
  elasticsearch:
    host: ${ES_HOST:elasticsearch}
    port: ${ES_PORT:9200}
    scheme: http
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}
mybatis-plus:
  mapper-locations: classpath*:mapper/**.xml
  type-aliases-package: org.yzh.web.model.entity
  config-location: classpath:mybatis/mybatis-config.xml
  type-handlers-package: com.eyougo.mybatis.postgis.type

server:
  port: 8100

jt-server:
  jt808:
    enable: true
    port:
      udp: 7100
      tcp: 7100
    media-file:
      path: ${JT_MEDIA_PATH:/app/media}
      url-prefix: ${JT_MEDIA_URL_PREFIX:http://localhost/media}
    alarm-file:
      host: 127.0.0.1
      port: 7200

  alarm-file:
    enable: true
    port: 7200
    path: ${JT_ALARM_PATH:/app/alarm}

cms-server:
  host: ${CMS_HOST:cms}
  port: ${CMS_PORT:8088}
