# 项目相关配置
agri:
  # 名称
  name: Agri-CMS
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/name/uploadPath，Linux配置 /home/name/uploadPath）
  # 容器内通过 AGRI_PROFILE 环境变量覆盖
  profile: ${AGRI_PROFILE:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8088
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.agri.cms: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: dev
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥，生产环境必须通过 TOKEN_SECRET 环境变量覆盖
  secret: ${TOKEN_SECRET:dev-only-secret-please-change-in-production-0123456789}
  # 令牌有效期（默认30天）
  expireTime: 2592000000

# PageHelper分页插件
pagehelper:
  #  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
  auto-runtime-dialect: true
gaode:
  key: ${GAODE_KEY:}
  url: https://restapi.amap.com/v3/staticmap
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.agri.cms.**.domain
  config-location: classpath:mybatis/mybatis-config.xml
  type-handlers-package: com.eyougo.mybatis.postgis.type
# Springdoc配置（分组统一在 SwaggerConfig 中以 Bean 形式维护）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha


# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

#  debezium消息解析配置—— [topic:全类名]
debezium:
  mappings:
    sync-mysql.ry-vue.sys_logininfor: com.agri.cms.system.domain.SysLogininfor
    sync-mysql.ry-vue.sys_change_log: com.agri.cms.system.domain.ChangeLog
    sync-mysql.ry-vue.sys_notification: com.agri.cms.common.core.domain.model.Notification
#    "sync-pg-landPlot": "com.agri.cms.system.domain.landPlot"
