# 生产环境：所有连接与凭据通过环境变量注入，版本库不保留真实地址和密码
server:
  port: 8088
spring:
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: ${DRUID_LOGIN_USER:ruoyi}
        loginPassword: ${DRUID_LOGIN_PASSWORD:123456}
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        # 主库：MySQL（若依系统表）
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD}
        # 从库：PostgreSQL/PostGIS（农业业务表）
        pg:
          type: com.alibaba.druid.pool.DruidDataSource
          lazy: true
          driver-class-name: org.postgis.DriverWrapper
          url: jdbc:postgresql_postGIS://${PG_HOST:postgres}:${PG_PORT:5432}/${PG_DB:AgriNav}
          username: ${PG_USER:postgres}
          password: ${PG_PASSWORD}
          druid:
            initial-size: 5
            max-active: 20
            min-idle: 5
            max-wait: 60000
            validation-query: SELECT 1
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
      geo-distance: 1000
  elasticsearch:
    host: ${ES_HOST:elasticsearch}
    port: ${ES_PORT:9200}
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}
    scheme: http
    index: original_point
    request-size: 5000
    connection-timeout: 30000
    socket-timeout: 600000
    pool:
      max-conn-total: 100
      max-conn-per-route: 40
      validate-after-inactivity: 2000
    retry:
      max-retries: 3
      initial-backoff: 1000
    idle:
      time: 10000
      connections-per-route: 2

tencentcloud:
  account:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
  sms:
    sdk-app-id: ${SMS_APP_ID:}
    sign-name: ${SMS_SIGN:田界智航APP}
    template-id: ${SMS_TEMPLATE_ID:}
sms:
  mock:
    enabled: ${SMS_MOCK_ENABLED:true}
justAuth:
  mobile:
    wechat:
      client-id: ${WX_MOBILE_CLIENT_ID:}
      client-secret: ${WX_MOBILE_CLIENT_SECRET:}
  web:
    wechat:
      client-id: ${WX_WEB_CLIENT_ID:}
      client-secret: ${WX_WEB_CLIENT_SECRET:}
      redirect-uri: ${WX_WEB_REDIRECT_URI:http://localhost/loginOAuth}
