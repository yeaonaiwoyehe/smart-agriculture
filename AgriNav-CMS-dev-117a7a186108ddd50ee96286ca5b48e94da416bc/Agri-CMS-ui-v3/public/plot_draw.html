<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>耕地描点工具</title>
<script type="text/javascript">
  window._AMapSecurityConfig = { securityJsCode: 'a53275a1ec076de40de2cb9e5ef33888' };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7fca069831f58cc7bdc1951d08418a00&plugin=AMap.TileLayer.Satellite,AMap.TileLayer.RoadNet,AMap.Polygon,AMap.Marker"></script>
<style>
  html,body{margin:0;height:100%;}
  #map{position:absolute;left:0;right:320px;top:0;bottom:0;}
  #panel{position:absolute;right:0;top:0;width:320px;bottom:0;background:#fff;border-left:1px solid #ddd;padding:10px;box-sizing:border-box;overflow:auto;font-size:13px;}
  button{margin:4px 0;padding:6px 10px;width:100%;}
  pre{background:#f5f5f5;padding:6px;white-space:pre-wrap;word-break:break-all;}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>耕地描点工具</b><br>
  在卫星图上沿田块边界依次点击，双击结束。<br>
  <button id="clear">清空当前</button>
  <button id="save">生成当前多边形 WKT</button>
  <div id="info">点数：0</div>
  <pre id="out">（暂无）</pre>
</div>
<script>
var map = new AMap.Map('map', {
  zoom: 16,
  center: [114.83, 38.03],
  viewMode: '2D',
  layers: [
    new AMap.TileLayer.Satellite(),
    new AMap.TileLayer.RoadNet({ opacity: 0.8 })
  ]
});
var pts = [];
var poly = null;
var markers = [];

function refresh() {
  document.getElementById('info').innerText = '点数：' + pts.length;
  if (poly) map.remove(poly);
  if (pts.length >= 2) {
    poly = new AMap.Polygon({
      path: pts.concat([pts[0]]),
      strokeColor: '#ff0000', strokeWeight: 2, fillColor: '#ff0000', fillOpacity: 0.25
    });
    map.add(poly);
  }
}

map.on('click', function (e) {
  pts.push([e.lnglat.getLng(), e.lnglat.getLat()]);
  var m = new AMap.Marker({ position: e.lnglat, label: { content: String(pts.length), direction: 'top' } });
  markers.push(m); map.add(m);
  refresh();
});
map.on('dblclick', function () { makeWKT(); });

document.getElementById('clear').onclick = function () {
  pts = [];
  markers.forEach(function (m) { map.remove(m); });
  markers = [];
  if (poly) { map.remove(poly); poly = null; }
  document.getElementById('out').innerText = '（暂无）';
  refresh();
};
document.getElementById('save').onclick = makeWKT;

function makeWKT() {
  if (pts.length < 3) { document.getElementById('out').innerText = '至少需要 3 个点'; return; }
  var ring = pts.concat([pts[0]]);
  var wkt = 'POLYGON((' + ring.map(function (p) { return p[0] + ' ' + p[1]; }).join(',') + '))';
  document.getElementById('out').innerText = wkt;
}
</script>
</body>
</html>
